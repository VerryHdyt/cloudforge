services:
  postgres:
    image: postgres:17-alpine
    container_name: cloudforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudforge
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: cloudforge_dev_password
    ports:
      - "5433:5432"
    volumes:
      - cloudforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudforge -d cloudforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cloudforge_postgres_data:
